name: Sync Top Sympathy Records

on:
  schedule:
    # Runs every day at 18:00 UTC (03:00 AM KST)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/**'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Sync Protocol
        run: node scripts/sync-records.js

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html script.js records.json
          if git diff --staged --quiet; then
            echo "No changes in records."
          else
            git commit -m "chore(sync): update top sympathy records [skip ci]"
            git push
          fi
